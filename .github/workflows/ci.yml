name: Nūr Social AI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile nur_generator.py media_quality.py brand_tokens.py output_validation.py telegram_publisher.py telegram_review.py tests/test_provider_discovery.py tests/test_telegram_review.py tests/test_media_quality.py tests/test_visual_providers.py cloudflare_visuals.py tests/test_cloudflare_visuals.py agnes_video.py tests/test_agnes_video.py scene_video_provider.py tests/test_scene_video_provider.py tests/test_brand_tokens.py tests/test_brand_config.py tests/test_output_validation.py tests/test_qa_integration.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
