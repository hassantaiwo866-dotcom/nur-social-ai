name: Nūr Social AI checks

on:
  push:
    branches:
      - stabilise/day-1-provider-media-resilience
      - day3/production-run-manifest
  pull_request:
    branches:
      - main
      - stabilise/day-1-provider-media-resilience
      - day3/production-run-manifest

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile nur_generator.py media_quality.py telegram_publisher.py telegram_review.py story_format.py visual_direction.py visual_prompting.py tests/test_provider_discovery.py tests/test_telegram_review.py tests/test_media_quality.py tests/test_visual_providers.py tests/test_visual_direction.py tests/test_visual_prompting.py cloudflare_visuals.py tests/test_cloudflare_visuals.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
