name: NŪR Scheduled Content Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate NŪR Image and Vertical Video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python nur_generator.py

      - name: Deliver finished assets to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_publisher.py

      - name: Save topic history so NŪR never repeats topics
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NŪR topic history" && git push)
