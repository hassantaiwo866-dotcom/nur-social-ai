
name: Nūr Media Production

on:
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-media:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Nūr media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python nur_generator.py

      - name: Upload generated media for review
        uses: actions/upload-artifact@v4
        with:
          name: nur-media-${{ github.run_number }}
          path: |
            output/nur_post.png
            output/nur_reel.mp4
            output/latest_post.json
          if-no-files-found: error
          retention-days: 14

      - name: Save topic history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          git diff --cached --quiet || (
            git commit -m "Update Nūr topic history"
            git push
          )
          
